name: scroll_atlas
description: >-
  Precise scrolling for Flutter. Jump to any index in any sliver, below pinned
  and sticky headers, sync tabs with the scroll, and link scroll controllers.
version: 0.2.0-dev.1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_sticky_header: ^0.7.0
  flutter_test:
    sdk: flutter
  sliver_tools: ^0.2.12

topics:
  - scrolling
  - listview
  - sliver
  - widget
  - ui

screenshots:
  - description: "scroll_atlas: scroll to any item, land below sticky headers, tabs that follow the scroll."
    path: assets/hero.png
  - description: "Restaurant menu with category tabs that follow the sections and jump in one move."
    path: assets/screenshots/food_menu.png
  - description: "Contacts A to Z with sticky letter headers and an index rail."
    path: assets/screenshots/contacts.png
  - description: "Table booking grid that scrolls diagonally with a frozen time row and table column."
    path: assets/screenshots/table_bookings.png
  - description: "Chat that opens at the first unread message."
    path: assets/screenshots/chat.png

